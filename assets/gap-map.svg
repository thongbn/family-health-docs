<svg xmlns="http://www.w3.org/2000/svg" width="700" height="510" viewBox="0 0 700 510" role="img" aria-labelledby="t d"><title id="t">Khoảng trống điều phối giữa số và tại nhà</title><desc id="d">Sơ đồ khái niệm nối Long Châu và WeCare247 bằng care manager và báo cáo thực thi; MEDLATEC đã gần mô hình này.</desc><rect width="700" height="510" rx="12" fill="#edf2e8"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="350" y="47" fill="#193e38" font-size="20" font-weight="bold">TỪ TIẾP CẬN → ĐẾN HOÀN TẤT</text><path d="M150 155H550" stroke="#a7bfaa" stroke-width="3"/><rect x="30" y="95" width="235" height="105" rx="12" fill="#fff"/><rect x="435" y="95" width="235" height="105" rx="12" fill="#fff"/><g fill="#193e38" font-size="22" font-weight="bold"><text x="147" y="133">Long Châu 247</text><text x="552" y="133">WeCare247</text></g><g fill="#5d716a" font-size="14"><text x="147" y="162">Theo dõi số · Tiếp cận thuốc</text><text x="552" y="162">Nhân lực · Chăm sóc tại nhà</text></g><path d="M147 200L250 280M552 200L450 280" stroke="#a7bfaa" stroke-width="2"/><rect x="145" y="248" width="410" height="144" rx="14" fill="#123e38"/><text x="350" y="282" fill="#e4b594" font-size="12" letter-spacing="2">GIẢ THUYẾT DỰ ÁN</text><text x="350" y="314" fill="#fff" font-size="23" font-weight="bold">Care Manager + Family Plan</text><text x="350" y="345" fill="#d1dfd5" font-size="15">Phân công → Theo sát → Xác nhận</text><text x="350" y="373" fill="#d1dfd5" font-size="15">Báo cáo cho người thân được ủy quyền</text><text x="350" y="439" fill="#193e38" font-size="14">MEDLATEC đã gần mô hình lâm sàng này.</text><text x="350" y="467" fill="#5d716a" font-size="12">Khác biệt cần kiểm chứng: điều phối đa nhà cung cấp.</text></g></svg>
