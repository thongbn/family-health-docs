<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="t d"><title id="t">Hub Family Health Management</title><desc id="d">Gia đình, care manager và health worker kết nối đối tác lâm sàng, nhà thuốc, xét nghiệm và các bên thanh toán.</desc><rect width="1100" height="600" rx="12" fill="#edf2e8"/><g stroke="#abc0ad" stroke-width="2" fill="none"><path d="M550 165V225M400 300L260 120M400 300H260M400 350L260 485M700 300L840 120M700 300H840M700 350L840 485M550 390V475"/></g><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="385" y="50" width="330" height="115" rx="16" fill="#fff" stroke="#cfdbca"/><text x="550" y="95" fill="#193e38" font-size="25" font-weight="bold">FAMILY</text><text x="550" y="126" fill="#5d716a" font-size="15">Mục tiêu · Đồng ý · Quyền truy cập</text><rect x="365" y="225" width="370" height="165" rx="18" fill="#123e38"/><text x="550" y="263" fill="#b7cfbc" font-size="12" letter-spacing="2">FAMILY HEALTH MANAGEMENT</text><text x="550" y="301" fill="#fff" font-size="27" font-weight="bold">Care Manager</text><text x="550" y="331" fill="#d8e4d8" font-size="16">Một người phụ trách · Một kế hoạch</text><text x="550" y="362" fill="#e4b594" font-size="14">Bác sĩ duyệt kế hoạch &amp; xử trí lâm sàng</text><g fill="#fff" stroke="#cfdbca"><rect x="40" y="75" width="235" height="92" rx="12"/><rect x="40" y="265" width="235" height="92" rx="12"/><rect x="40" y="440" width="235" height="92" rx="12"/><rect x="825" y="75" width="235" height="92" rx="12"/><rect x="825" y="265" width="235" height="92" rx="12"/><rect x="825" y="440" width="235" height="92" rx="12"/></g><g fill="#193e38" font-size="19" font-weight="bold"><text x="157" y="112">Bệnh viện / Phòng khám</text><text x="157" y="302">Bác sĩ phụ trách</text><text x="157" y="477">Điều dưỡng / Hộ lý</text><text x="942" y="112">Nhà thuốc</text><text x="942" y="302">Xét nghiệm</text><text x="942" y="477">Bảo hiểm / Doanh nghiệp</text></g><g fill="#5d716a" font-size="14"><text x="157" y="140">Chuyển tuyến có phản hồi</text><text x="157" y="330">Chẩn đoán · Kế hoạch · Review</text><text x="157" y="505">Chăm sóc đúng chuyên môn</text><text x="942" y="140">Thuốc theo đơn · Giao nhận</text><text x="942" y="330">Lấy mẫu · Trả kết quả</text><text x="942" y="505">Quyền lợi &amp; nguồn thanh toán</text></g><rect x="375" y="475" width="350" height="85" rx="13" fill="#d8e6d3"/><text x="550" y="509" fill="#193e38" font-size="23" font-weight="bold">Health Worker</text><text x="550" y="536" fill="#456955" font-size="14">Hỗ trợ tại nhà · Ghi nhận · Xác minh</text></g></svg>
